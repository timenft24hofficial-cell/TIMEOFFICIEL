<style>
:root{--bg:#050505;--ink:#0f0f12;--red:#e51919;--hot:#ff4040;--tx:#f3f3f4;--mut:#8b8b93;--line:#1e1e24}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 "Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700}

/* header */
header{position:fixed;inset:0 0 auto;z-index:50;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #1a0b0b;padding-top:env(safe-area-inset-top)}
header .wrap{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand img{height:34px;width:auto}
nav{display:none}
nav a{margin-left:28px;color:#c9c9ce;font-size:14px;transition:color .2s}
nav a:hover{color:var(--hot)}
